# Latein-Vokabeltrainer als Website
#
#   docker compose up -d --build     ->  http://localhost:8080
#   anderer Port:  WEB_PORT=80 docker compose up -d
#
# Die Lernstaende aller Besucher liegen im Volume "lernstand"
# (je Lerncode ein Ordner) und ueberleben Neustarts und Updates.

services:
  app:
    build:
      context: .
      target: app
    image: latein-vokabeln-app
    restart: unless-stopped
    volumes:
      - lernstand:/lernstand
    expose:
      - "8765"

  web:
    build:
      context: .
      target: web
    image: latein-vokabeln-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  lernstand:
