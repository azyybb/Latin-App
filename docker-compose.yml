# Latein-Vokabeltrainer als Website
#
#   Lokal:    docker compose up -d --build   ->  http://localhost:8080
#             (der Host-Port kommt aus docker-compose.override.yml,
#              anderer Port:  WEB_PORT=80 docker compose up -d)
#   Coolify:  diese Datei als Compose-Quelle nehmen.  Die Domain gehoert
#             an den Service "web" mit Container-Port 80 (nicht 8080!) -
#             die Variable SERVICE_FQDN_WEB_80 unten setzt das automatisch.
#             Keine "ports:" hier: den Proxy erledigt Coolifys Traefik.
#
# Die Lernstaende aller Besucher liegen im Volume "lernstand"
# (je Lerncode ein Ordner) und ueberleben Neustarts und Updates.

services:
  app:
    build:
      context: .
      target: app
    image: latein-vokabeln-app
    restart: unless-stopped
    volumes:
      - lernstand:/lernstand
    expose:
      - "8765"
    ports:
      - "8765:8765"
  web:
    build:
      context: .
      target: web
    image: latein-vokabeln-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "80"
    environment:
      - SERVICE_FQDN_WEB_80

volumes:
  lernstand:
