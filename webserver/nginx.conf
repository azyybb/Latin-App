# nginx vor dem Vokabeltrainer: Seite und Buchseiten kommen direkt von hier,
# nur /api/ (Suche, Quiz, Fehlerliste ...) geht an den Python-Server.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 64k;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Die Seite selbst nie zwischenspeichern, sonst sieht man Updates erst spaet
    location = /index.html {
        expires -1;
    }

    location /bild/ {
        expires 7d;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://app:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Beim allerersten Aufruf laedt der Server noch die Vokabeln
        proxy_read_timeout 90s;
    }

    location = /gesund {
        proxy_pass http://app:8765;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
